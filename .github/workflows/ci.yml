name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the reference Runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run the test suite
        run: PYTHONPATH=src python -m pytest tests -q

      # Data regressions are as damaging as code regressions: a Scenario that no
      # longer satisfies the Scenario schema cannot be run or scored.
      - name: Validate every Scenario against the Scenario schema
        run: |
          status=0
          count=0
          for scenario in scenarios/dev/*/MIB-*.json; do
            count=$((count + 1))
            if ! mib validate "$scenario" --schema schemas/mib-scenario.schema.json >/dev/null; then
              echo "::error file=${scenario}::Scenario failed schema validation"
              mib validate "$scenario" --schema schemas/mib-scenario.schema.json || true
              status=1
            fi
          done
          echo "validated ${count} Scenarios"
          test "${count}" -gt 0 || { echo "::error::no Scenarios were found to validate"; status=1; }
          exit "${status}"
