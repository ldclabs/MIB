name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the reference Runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run the test suite
        run: PYTHONPATH=src python -m pytest tests -q

      # Data regressions are as damaging as code regressions: a Scenario that no
      # longer satisfies the Scenario schema cannot be run or scored.
      - name: Validate every Scenario against the Scenario schema
        shell: python
        run: |
          from pathlib import Path
          from mib_runner.validation import load_json, validate_scenario

          schema = load_json("schemas/mib-scenario.schema.json")
          scenarios = sorted(Path("scenarios").rglob("MIB-*.json"))
          if not scenarios:
              raise SystemExit("No Scenarios found")
          failed = 0
          for path in scenarios:
              result = validate_scenario(load_json(path), schema)
              if not result.valid:
                  failed += 1
                  print(f"::error file={path}::{result.errors}")
          print(f"Validated {len(scenarios)} Scenarios, {failed} failed")
          raise SystemExit(bool(failed))
